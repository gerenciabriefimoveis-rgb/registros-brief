<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#1f5fbf">
<title>Visitas Brief</title>
<link rel="manifest" href="visitas.webmanifest">
<link rel="icon" href="icone-visitas-192.png">
<link rel="apple-touch-icon" href="icone-visitas-192.png">
<style>
  :root { --azul:#1f5fbf; --verde:#1e8e3e; --vermelho:#c5221f; --cinza:#5f6368; --fundo:#f4f6f9; }
  * { box-sizing:border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--fundo); color:#202124; font-size:18px; }
  header { background:var(--azul); color:#fff; padding:14px 16px; font-size:20px; font-weight:600; position:sticky; top:0; z-index:2; }
  main { padding:12px; max-width:560px; margin:0 auto; }
  .card { background:#fff; border-radius:14px; padding:16px; margin-bottom:12px; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .passo { font-size:14px; color:var(--cinza); text-transform:uppercase; letter-spacing:.04em; margin-bottom:8px; }
  input[type=search], textarea { width:100%; font-size:20px; padding:14px; border:2px solid #dadce0; border-radius:10px; font-family:inherit; }
  textarea { font-size:18px; min-height:90px; }
  .lista button { display:block; width:100%; text-align:left; font-size:18px; padding:14px; margin-top:8px; border:1px solid #dadce0; background:#fff; border-radius:10px; color:#202124; }
  .lista small, .grupo { color:var(--cinza); font-size:15px; }
  .escolhida { font-size:24px; font-weight:700; color:var(--azul); line-height:1.25; }
  .link { background:none; border:none; color:var(--azul); font-size:16px; text-decoration:underline; padding:8px 0; }
  .tipos { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px; }
  .tipos button { font-size:16px; padding:14px 8px; border:2px solid #dadce0; background:#fff; border-radius:12px; color:#202124; }
  .tipos button.sel { border-color:var(--azul); font-weight:700; color:var(--azul); }
  .grande { display:block; width:100%; font-size:20px; font-weight:600; padding:18px; border:none; border-radius:12px; color:#fff; background:var(--azul); margin-top:8px; text-align:center; font-family:inherit; }
  .grande.clara { opacity:.85; }
  .grande.verde { background:var(--verde); }
  .grande.vermelho { background:var(--vermelho); }
  .grande.cinza { background:#9aa0a6; }
  label.grande { cursor:pointer; }
  input[type=file] { display:none; }
  .miniaturas { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
  .miniaturas div { width:64px; height:64px; border-radius:8px; background:#e8eaed center/cover no-repeat; font-size:11px; display:flex; align-items:center; justify-content:center; }
  .contagem { margin-top:8px; color:var(--cinza); font-size:16px; }
  .audios div { padding:8px 0; border-bottom:1px solid #eee; font-size:16px; }
  .barra { height:18px; background:#e8eaed; border-radius:9px; overflow:hidden; margin:10px 0; }
  .barra div { height:100%; width:0; background:var(--verde); transition:width .3s; }
  .ok { font-size:22px; font-weight:700; color:var(--verde); }
  .erro { color:var(--vermelho); font-weight:600; }
  .oculto { display:none; }
</style>
</head>
<body data-modo="visitas">
<header>&#128203; Visitas Brief</header>
<main>
  <div id="telaForm">
    <div class="card">
      <div class="passo">1. Qual unidade?</div>
      <div id="buscaBox">
        <input type="search" id="busca" placeholder="Digite o número (ex.: 707)" autocomplete="off">
        <div class="contagem" id="carregando">Carregando unidades…</div>
        <div class="lista" id="lista"></div>
      </div>
      <div id="unidadeBox" class="oculto">
        <div class="escolhida" id="unidadeNome"></div>
        <div class="grupo" id="unidadeGrupo"></div>
        <button class="link" onclick="trocarUnidade()">Trocar unidade</button>
      </div>
    </div>

    <div class="card">
      <div class="passo">2. O que &eacute; esta visita?</div>
      <input type="search" id="tipoTexto" placeholder="Ex.: vazamento no banheiro" autocomplete="off" maxlength="80">
      <div class="contagem">Ou toque num atalho:</div>
      <div class="tipos" id="tipos"></div>
    </div>

    <div class="card">
      <div class="passo">3. Fotos e vídeos</div>
      <label class="grande" for="camera">📷 Tirar foto</label>
      <input type="file" id="camera" accept="image/*" capture="environment">
      <label class="grande clara" for="galeria">🖼️ Escolher várias da galeria</label>
      <input type="file" id="galeria" accept="image/*,video/*" multiple>
      <div class="contagem" id="contagemFotos">Nenhuma foto ainda.</div>
      <div class="miniaturas" id="miniaturas"></div>
    </div>

    <div class="card">
      <div class="passo">4. Áudio (fale o que viu)</div>
      <button class="grande vermelho" id="btnGravar" onclick="alternarGravacao()">● Gravar áudio</button>
      <div class="audios" id="audios"></div>
    </div>

    <div class="card">
      <div class="passo">5. Observação (opcional)</div>
      <textarea id="obs" placeholder="Escreva algo se quiser"></textarea>
    </div>

    <div id="aviso" class="erro" style="margin:0 4px 8px"></div>
    <button class="grande verde" onclick="enviar()">✅ Enviar tudo</button>
    <div style="height:30px"></div>
  </div>

  <div id="telaEnvio" class="card oculto">
    <div class="passo">Enviando</div>
    <div id="envioTexto">Não feche o app.</div>
    <div class="barra"><div id="barra"></div></div>
    <div id="envioDetalhe" class="contagem"></div>
  </div>

  <div id="telaFim" class="card oculto">
    <div class="ok" id="fimTitulo"></div>
    <div id="fimTexto" style="margin-top:10px"></div>
    <button class="grande" onclick="location.reload()">Novo registro</button>
  </div>
</main>
<script src="app.js"></script>
</body>
</html>
